<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      The Content Security Policy is injected here at build time from
      server/security/csp.cjs — the same file the server hands to helmet.

      It has to travel in the document rather than as a header because
      Hostinger's edge rewrites Content-Security-Policy on every proxied
      response down to "upgrade-insecure-requests", so the header never
      reaches a browser. This meta copy does.

      Do not write the policy here by hand. Two hand-maintained copies drift,
      and the one that drifts unnoticed is this one — the only one users are
      actually protected by. Edit server/security/csp.cjs instead.
    -->
    <!--CSP-->

    <!-- Primary Meta Tags -->
    <title>Inspire Educational Institutions | Junior College in Hyderabad</title>
    <meta name="title" content="Inspire Educational Institutions | Junior College in Hyderabad" />
    <meta name="description" content="Inspire Educational Institutions — MPC, BiPC and MEC junior college programmes across four campuses in Hyderabad, with residential facilities, expert faculty and dedicated mentorship." />
    <meta name="theme-color" content="#087FBC" />
    <link rel="canonical" href="https://inspirehnk.org/" />

    <!--
      The title and description above describe the COLLEGE, not the login
      screen. They previously read "Administrative Portal Gateway … Secure
      login for Rector, Principal, Accountants", which is what a search result
      for the college's own name would have shown a prospective parent. The
      portal is the part of this site the public has no use for; the marketing
      pages are what the domain is for.
    -->

    <!-- Open Graph — what WhatsApp, Facebook and LinkedIn render for a shared link -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inspire Educational Institutions" />
    <meta property="og:url" content="https://inspirehnk.org/" />
    <meta property="og:title" content="Inspire Educational Institutions | Junior College in Hyderabad" />
    <meta property="og:description" content="MPC, BiPC and MEC programmes across four campuses in Hyderabad, with residential facilities, expert faculty and dedicated mentorship." />
    <meta property="og:image" content="https://inspirehnk.org/og-preview.png" />
    <meta property="og:image:alt" content="Inspire Educational Institutions campus" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inspire Educational Institutions | Junior College in Hyderabad" />
    <meta name="twitter:description" content="MPC, BiPC and MEC programmes across four campuses in Hyderabad, with residential facilities, expert faculty and dedicated mentorship." />
    <meta name="twitter:image" content="https://inspirehnk.org/og-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
