<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      The Content Security Policy is injected here at build time from
      server/security/csp.cjs — the same file the server hands to helmet.

      It has to travel in the document rather than as a header because
      Hostinger's edge rewrites Content-Security-Policy on every proxied
      response down to "upgrade-insecure-requests", so the header never
      reaches a browser. This meta copy does.

      Do not write the policy here by hand. Two hand-maintained copies drift,
      and the one that drifts unnoticed is this one — the only one users are
      actually protected by. Edit server/security/csp.cjs instead.
    -->
    <!--CSP-->

    <!-- Primary Meta Tags -->
    <title>Inspire Educational Institutions | Administrative Portal Gateway</title>
    <meta name="title" content="Inspire Educational Institutions | Administrative Portal Gateway" />
    <meta name="description" content="Official administrative portal gateway of Inspire Educational Institutions. Secure login for Rector, Principal, Accountants, and Authenticator systems." />
    <meta name="theme-color" content="#087FBC" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
